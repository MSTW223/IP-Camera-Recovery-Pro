
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key
            - name: Check signing key fingerprint
        run: |
          echo "SHA256 fingerprint of GitHub signing key:"
          sha256sum release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks

      - name: Verify signing credentials
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking keystore password..."
          keytool -list \
            -keystore release-key.jks \
            -storepass "$STORE_PASS" \
            -alias ip-camera-recovery

          echo "Checking private key password..."
          keytool -certreq \
            -alias ip-camera-recovery \
            -keystore release-key.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -file /tmp/signing-check.csr

          echo "Signing credentials verified."
      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IP-Camera-Recovery-Pro-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f release-key.jks
