
name: Create Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Generate signing key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias ip-camera-recovery \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=IP Camera Recovery Pro, OU=Mobile, O=IP Camera Recovery, L=Bursa, ST=Bursa, C=TR"

          keytool -list \
            -keystore release-key.jks \
            -storepass "$STORE_PASS" \
            -alias ip-camera-recovery

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-key
          path: release-key.jks
          retention-days: 1
